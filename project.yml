name: Schulplan
options:
  bundleIdPrefix: de.codeunity
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: W63SR2C3Q9
targets:
  Schulplan:
    type: application
    platform: iOS
    sources:
      - path: Schulplan
    dependencies:
      - target: SchulplanWidget
    entitlements:
      path: Schulplan/Schulplan.entitlements
      properties:
        # Eigene Gruppe zuerst: bleibt Standard für die Zugangsdaten. Die zweite teilt den Widget-Stand.
        keychain-access-groups:
          - $(AppIdentifierPrefix)de.codeunity.Schulplan
          - $(AppIdentifierPrefix)de.codeunity.Schulplan.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.codeunity.Schulplan
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    info:
      path: Schulplan/Info.plist
      properties:
        CFBundleDisplayName: Schulplan
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: de.codeunity.Schulplan
            CFBundleURLSchemes:
              - schulplan
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - de.codeunity.Schulplan.refresh
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  SchulplanWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SchulplanWidget
      - path: Schulplan/Shared
    entitlements:
      path: SchulplanWidget/SchulplanWidget.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)de.codeunity.Schulplan.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.codeunity.Schulplan.Widget
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: SchulplanWidget/Info.plist
      properties:
        CFBundleDisplayName: Schulplan
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
